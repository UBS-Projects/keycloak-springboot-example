<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>User Management System</h1>
            <div class="user-info">
                Logged in as: <strong sec:authentication="name">User</strong>
            </div>
        </div>

        <div class="navigation">
            <ul>
                <li><a th:href="@{/home}">Home</a></li>
                <li><a th:href="@{/users}">User Management</a></li>
                <li><a th:href="@{/roles}">Role Management</a></li>
                <li><a th:href="@{/test}">Test Page</a></li>
                <li>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-secondary btn-small">Logout</button>
                    </form>
                </li>
            </ul>
        </div>

        <div class="content">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <div class="d-flex justify-content-between mb-3">
                <h2>Users</h2>
                <a th:href="@{/users/new}" class="btn btn-primary">Add New User</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Roles</th>
                        <th>Enabled</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">username</td>
                        <td th:text="${user.email}">email@example.com</td>
                        <td th:text="${user.firstName + ' ' + user.lastName}">Full Name</td>
                        <td>
                            <span th:each="role : ${user.roles}" th:text="${role.name}" class="badge">ROLE</span>
                        </td>
                        <td th:text="${user.enabled ? 'Yes' : 'No'}">Yes</td>
                        <td>
                            <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-primary btn-small">Edit</a>
                            <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-danger btn-small"
                                        onclick="return confirm('Are you sure you want to delete this user?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
